name: Cdn Downloader V2
inputs:
  - {name: training_data_cdn, type: String, description: "CDN URL to download training data file"}
  - {name: bearer_token, type: string, description: "Bearer token for CDN authentication"}

outputs:
  - {name: training_data, type: Dataset, description: "Downloaded training data file"}

implementation:
  container:
    image: gurpreetgandhi/nesy-factory:vtest4
    command:
      - python3
      - -u
      - -c
      - |
        import argparse
        import os
        import requests
        from requests.adapters import HTTPAdapter
        try:
            from urllib3.util import Retry
        except Exception:
            from urllib3 import Retry

        parser = argparse.ArgumentParser()
        parser.add_argument('--training_data_cdn', required=True)
        parser.add_argument('--bearer_token', required=True)
        parser.add_argument('--training_data', required=True)

        args = parser.parse_args()

        with open(args.bearer_token, "r") as f:
            bearer_token = f.read().strip()

        # Setup session for downloading
        session = requests.Session()
        try:
            retry_strategy = Retry(
                total=3,
                backoff_factor=1,
                status_forcelist=[500, 502, 503, 504],
                allowed_methods=frozenset(["GET", "HEAD"])
            )
        except TypeError:
            retry_strategy = Retry(
                total=3,
                backoff_factor=1,
                status_forcelist=[500, 502, 503, 504],
                method_whitelist=frozenset(["GET", "HEAD"])
            )

        adapter = HTTPAdapter(max_retries=retry_strategy)
        session.mount("http://", adapter)
        session.mount("https://", adapter)

        headers = {"Authorization": f"Bearer {bearer_token}"}

        # Download file from CDN
        print(f"Downloading file from: {args.training_data_cdn}")
        response = session.get(args.training_data_cdn, headers=headers, timeout=120)
        response.raise_for_status()
        
        # Save downloaded file to output path
        os.makedirs(os.path.dirname(args.training_data) or ".", exist_ok=True)
        with open(args.training_data, "wb") as f:
            f.write(response.content)
        
        print(f"File downloaded successfully to: {args.training_data}")

    args:
      - --training_data_cdn
      - {inputValue: training_data_cdn}
      - --bearer_token
      - {inputPath: bearer_token}
      - --training_data
      - {outputPath: training_data}
